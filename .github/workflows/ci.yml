name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Backend: build, then test the build ----------
  backend-build:
    name: Backend build (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore CinemaManager.slnx

      - name: Check formatting
        run: dotnet format CinemaManager.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CinemaManager.slnx --configuration Release --no-restore

      # Outside a container, the projects build in .host/ (see Directory.Build.props)
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/src/*/.host/
            backend/tests/*/.host/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  backend-test:
    name: Backend tests (.NET)
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cinema
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      ConnectionStrings__CinemaDb: Host=localhost;Port=5432;Database=cinema;Username=cinema;Password=ci-password;GSS Encryption Mode=Disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend

      # Fills the NuGet cache of this runner, used by the test host
      - name: Restore
        run: dotnet restore CinemaManager.slnx

      - name: Test
        run: dotnet test CinemaManager.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  # ---------- Frontend: build, then test ----------
  frontend-build:
    name: Frontend build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  frontend-test:
    name: Frontend tests (React)
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Also writes the results in JUnit XML and the coverage report in HTML
      - name: Test
        run: npm run coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ---------- Docker images, once both test jobs have passed ----------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Build images
        run: docker compose --env-file .env.example build
